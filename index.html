<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cesium 3D Globe</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body, #cesiumContainer {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    #infoPopup {
      display: none;
      position: absolute;
      background: rgba(0, 0, 0, 0.85);
      color: #fff;
      padding: 12px 16px;
      border-radius: 8px;
      font-size: 14px;
      pointer-events: none;
      z-index: 999;
      white-space: nowrap;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.2);
      font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    }

    #infoPopup .popup-title {
      font-weight: bold;
      font-size: 15px;
      margin-bottom: 6px;
      color: #4fc3f7;
      border-bottom: 1px solid rgba(255, 255, 255, 0.15);
      padding-bottom: 4px;
    }

    #infoPopup .popup-row {
      margin: 3px 0;
      color: #ccc;
    }

    #infoPopup .popup-row span {
      color: #fff;
    }
  </style>
</head>
<body>
  <div id="cesiumContainer"></div>
  <div id="infoPopup"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
